{% extends 'base.html' %}
{% block content %}
{% load static %}


<div class="flex-container">
    <img src="{% static 'images/basebanner.png' %}" alt="Sample Image">
</div>
<div>
<div class="about-head">
    <h1>About HMS</h1>
    <div class="about-left">
        {{content|safe}}
        <img src="{% static 'images/licence1.png' %}" style="width: 80px;height: 80px;">
    </div>
</div>
<div class="container">


    {% for i in images %}
    <div class="mySlides">
        <div class="numbertext">{{ forloop.counter }}/{{t_c}}</div>
        <img src="{% static 'images/' %}{{ i }}" style="width:620px;height: 400px;">
    </div>
    {% endfor %}
    <!-- Next and previous buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <!-- Image text -->
    <!-- <div class="caption-container">
        <p id="caption"></p>
    </div> -->

    <!-- Thumbnail images -->
    <div class="row">
        {% for i in images %}
        <div class="column">
            <img class="demo cursor" src="{% static 'images/' %}{{ i }}" style="width:100px;height: 100px;padding: 10px;"
                onclick="currentSlide(forloop.counter)" alt="The Woods">
        </div>
        {% endfor %}
    </div>
</div>
</div>

{% endblock %}
